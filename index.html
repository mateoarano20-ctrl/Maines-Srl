<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Maines SRL · Jetema · Xtralife</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050914;--ink:#e8f0ff;--mut:#8fa0c4;--a:#29aae1;--a2:#27367a;--glass:rgba(255,255,255,.05);--line:rgba(255,255,255,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-b=jetema]{--a:#3fb4e8;--a2:#4a6fb0}
:root[data-b=xtralife]{--a:#2fd26b;--a2:#cba72c}
*{box-sizing:border-box;margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 Manrope,system-ui,sans-serif;overflow-x:hidden;min-height:100vh}
canvas#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.glow{position:fixed;width:520px;height:520px;border-radius:50%;pointer-events:none;z-index:0;background:radial-gradient(circle,var(--a),transparent 65%);opacity:.16;transform:translate(-50%,-50%);transition:background .6s}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 4vw;backdrop-filter:blur(16px);background:rgba(5,9,20,.6);border-bottom:1px solid var(--line)}
.chip{background:#fff;border-radius:10px;padding:4px 10px;display:flex}.chip img{height:30px;display:block}
.tabs{display:flex;gap:6px;margin-left:auto;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--glass);position:relative}
.tabs button{position:relative;z-index:1;border:0;background:none;color:var(--mut);font:700 14px Manrope;padding:9px 18px;border-radius:999px;cursor:pointer;transition:color .3s}
.tabs button.on{color:#04101c}.pill{position:absolute;top:4px;bottom:4px;border-radius:999px;background:var(--a);transition:all .5s cubic-bezier(.7,0,.2,1);box-shadow:0 0 24px var(--a)}
.wa{background:none;border:1px solid var(--a);color:var(--a);padding:9px 16px;border-radius:999px;font:700 14px Manrope;text-decoration:none;transition:.3s}.wa:hover{background:var(--a);color:#04101c}
main{position:relative;z-index:1}section{padding:0 4vw}
.hero{min-height:82vh;display:grid;grid-template-columns:1.1fr .9fr;gap:4vw;align-items:center;max-width:1280px;margin:auto;padding:6vh 0}
h1{font:700 clamp(34px,5.6vw,76px)/1.04 Unbounded,sans-serif;letter-spacing:-.03em}
h1 span{display:inline-block;opacity:0;transform:translateY(40px) rotateX(-70deg);animation:in .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes in{to{opacity:1;transform:none}}
.grad{background:linear-gradient(90deg,var(--a),var(--a2),var(--a));background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 5s linear infinite}@keyframes sh{to{background-position:200%}}
.lead{color:var(--mut);max-width:52ch;margin:22px 0 30px;font-size:18px}
.btn{display:inline-block;border:0;cursor:pointer;background:var(--a);color:#04101c;font:700 15px Manrope;padding:14px 26px;border-radius:999px;text-decoration:none;box-shadow:0 0 30px -4px var(--a);transition:transform .3s}.btn:hover{transform:translateY(-3px) scale(1.03)}
.btn.g{background:none;color:var(--ink);border:1px solid var(--line);box-shadow:none;margin-left:10px}
.orb{aspect-ratio:1;position:relative;display:grid;place-items:center;perspective:900px}
.orb i{position:absolute;inset:0;border-radius:50%;border:1px solid var(--a);opacity:.5;animation:rot 14s linear infinite;border-top-color:transparent;border-left-color:transparent}
.orb i:nth-child(2){inset:9%;animation-duration:9s;animation-direction:reverse;border-color:var(--a2);border-bottom-color:transparent}
.orb i:nth-child(3){inset:19%;animation-duration:20s;border-style:dashed}@keyframes rot{to{transform:rotate(360deg)}}
.orb .chip{padding:22px 26px;border-radius:26px;box-shadow:0 0 90px -10px var(--a);animation:fl 5s ease-in-out infinite}.orb .chip img{height:auto;width:min(230px,38vw)}
@keyframes fl{50%{transform:translateY(-14px) rotateY(10deg)}}
.stats{display:flex;gap:30px;margin-top:36px;flex-wrap:wrap}.stats b{font:700 28px Unbounded;color:var(--a);display:block}.stats small{color:var(--mut)}
.wrap{max-width:1280px;margin:auto;padding:60px 0}
h2{font:700 clamp(26px,3.4vw,44px)/1.1 Unbounded;letter-spacing:-.02em;margin-bottom:12px}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:28px}
.panel{border:1px solid var(--line);background:var(--glass);border-radius:22px;padding:26px;backdrop-filter:blur(10px)}
.panel.link{cursor:pointer;transition:.4s}.panel.link:hover{border-color:var(--a);transform:translateY(-6px);box-shadow:0 20px 60px -20px var(--a)}
.panel h3{font:500 18px Unbounded;margin:14px 0 8px}.panel p{color:var(--mut)}.panel .chip{width:max-content}
.filters{display:flex;gap:8px;margin:20px 0 28px;flex-wrap:wrap}.filters button{background:none;border:1px solid var(--line);color:var(--mut);padding:8px 18px;border-radius:999px;font:700 13px Manrope;cursor:pointer;transition:.3s}.filters button.on{background:var(--a);border-color:var(--a);color:#04101c}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.card{border:1px solid var(--line);border-radius:22px;padding:22px;background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02));cursor:pointer;transform-style:preserve-3d;transition:transform .15s,border-color .3s;opacity:0;animation:in .7s forwards;position:relative;overflow:hidden}
.card:hover{border-color:var(--c)}.card::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),var(--c),transparent 55%);opacity:0;transition:.3s;pointer-events:none;mix-blend-mode:soft-light}.card:hover::after{opacity:.7}
.card svg{width:100%;height:150px;animation:fl 4.5s ease-in-out infinite;filter:drop-shadow(0 12px 22px var(--c))}
.tag{font:700 12px Manrope;color:var(--c);border:1px solid var(--c);border-radius:999px;padding:2px 10px;display:inline-block;margin-top:10px}
.card h3{font:500 16px Unbounded;margin:8px 0 4px}.card p{color:var(--mut);font-size:14px}
.modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(2,5,12,.75);backdrop-filter:blur(8px);padding:20px}.modal.open{display:grid}
.box{max-width:760px;width:100%;max-height:90vh;overflow:auto;background:#0a1226;border:1px solid var(--c);border-radius:26px;padding:30px;display:grid;grid-template-columns:.8fr 1.2fr;gap:24px;animation:pop .45s cubic-bezier(.2,1.2,.3,1);box-shadow:0 0 80px -20px var(--c)}
@keyframes pop{from{transform:scale(.8);opacity:0}}.box svg{width:100%;filter:drop-shadow(0 0 30px var(--c))}
.box ul{padding-left:18px;color:var(--mut);margin:12px 0 20px}.x{position:absolute;margin:-14px 0 0 0;background:none;border:0;color:var(--mut);font-size:26px;cursor:pointer;justify-self:end;grid-column:2}
.cta{text-align:center;padding:70px 20px;border:1px solid var(--line);border-radius:30px;background:radial-gradient(circle at 50% 0,rgba(255,255,255,.08),transparent 70%)}
footer{position:relative;z-index:1;text-align:center;color:var(--mut);padding:30px;font-size:13px;border-top:1px solid var(--line)}
.wipe{position:fixed;inset:0;z-index:40;background:var(--a);clip-path:circle(0 at 50% 0);pointer-events:none}.wipe.go{animation:wp .9s cubic-bezier(.7,0,.2,1)}@keyframes wp{40%{clip-path:circle(150% at 50% 0)}100%{clip-path:circle(150% at 50% 0);opacity:0}}
@media(max-width:820px){.hero,.box{grid-template-columns:1fr}.orb{max-width:300px;margin:auto}.tabs{margin:0;width:100%;justify-content:space-between}.tabs button{padding:9px 10px;font-size:13px}.wa{display:none}.btn.g{margin:10px 0 0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}h1 span,.card{opacity:1;transform:none}}
:focus-visible{outline:2px solid var(--a);outline-offset:3px}
</style></head><body>
